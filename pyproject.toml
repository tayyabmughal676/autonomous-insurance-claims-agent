[project]
name = "data-daur"
version = "1.5.0"
description = "Data Daur — Autonomous Multi-Agent Insurance Claims Processing Engine"
readme = "README.md"
authors = [
    { name = "Data Daur", email = "engineering@datadaur.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi-cli>=0.0.32",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.5",
    "langgraph>=1.2.11",
    "openai>=3.1.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.0",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pyrefly]
search-path = ["."]
project-includes = ["**/*.py"]
